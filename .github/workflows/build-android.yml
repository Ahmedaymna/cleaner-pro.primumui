name: 🚀 Build Android APK (Production Ready)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build:
    name: 🏗️ Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: ☕ Setup Java (v17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🏗️ Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 36.0.0
          ndk-version: 27.1.12297006

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: 📥 Install dependencies
        run: |
          npm install -g @expo/cli@latest
          pnpm install --frozen-lockfile
        continue-on-error: false

      - name: 🧹 Clean Gradle cache
        run: |
          cd android && ./gradlew clean --no-daemon || true
          cd ..

      - name: 🔧 Update Gradle plugins
        run: |
          cd android
          ./gradlew wrapper --gradle-version=8.14.3 --no-daemon || true
          cd ..

      - name: 🚀 Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          NODE_ENV: production
        run: |
          eas build --platform android \
            --profile ${{ github.event.inputs.profile || 'preview' }} \
            --non-interactive \
            --wait \
            --output ./build/cleaner-pro-${{ github.event.inputs.profile || 'preview' }}.apk

      - name: 📋 Check build output
        run: |
          if [ -f ./build/*.apk ]; then
            ls -lh ./build/*.apk
            echo "✅ APK build successful"
          else
            echo "⚠️ APK not found, checking build artifacts..."
            find . -name "*.apk" -type f 2>/dev/null
          fi

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleaner-pro-${{ github.event.inputs.profile || 'preview' }}-apk
          path: ./build/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: 📊 Generate build report
        if: always()
        run: |
          echo "## ✅ Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Property | 📋 Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷️ Profile | ${{ github.event.inputs.profile || 'preview' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 Platform | Android APK |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔗 Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📅 Date | $(date) |" >> $GITHUB_STEP_SUMMARY
          echo "| 👤 Author | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Download APK from artifacts" >> $GITHUB_STEP_SUMMARY
          echo "2. Test on device" >> $GITHUB_STEP_SUMMARY
          echo "3. Upload to Play Store" >> $GITHUB_STEP_SUMMARY

      - name: 🔔 Build notification
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : '❌';
            core.info(`${emoji} Build Status: ${status}`)
